name: Uppdatera kampanjer
on:
  schedule:
    - cron: "0 5 * * 1"   # varje måndag 05:00 UTC
  workflow_dispatch:       # knapp för att köra manuellt
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scraper.py
      - name: Spara data.json
        run: |
          git config user.name "kampanjbot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Uppdatera kampanjer"
          git push
